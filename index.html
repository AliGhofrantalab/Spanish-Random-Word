<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Random Word</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="theme-container">
        ☀️
        <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
        🌙
    </div>

    <h1>Spanish Random Word</h1>

    <div id="wordCard">
        <h2 id="word">Palabra</h2>
        <p id="meaning">معنی</p>
        <p id="example">مثال</p>
    </div>

    <button id="btn">New Word</button>

</div>

<script src="script.js"></script>

</body>
</html>
